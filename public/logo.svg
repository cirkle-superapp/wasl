<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wasl-logo-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25D366"/>
      <stop offset="0.5" stop-color="#128C7E"/>
      <stop offset="1" stop-color="#075E54"/>
    </linearGradient>
    <linearGradient id="wasl-logo-ring" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25D366"/>
      <stop offset="1" stop-color="#075E54"/>
    </linearGradient>
    <style type="text/css">
      .wasl-breathe { animation: wasl-breathe 2.6s ease-in-out infinite; transform-origin: 32px 32px; }
      .wasl-dot { animation: wasl-dot 1.4s ease-in-out infinite; }
      .wasl-dot:nth-of-type(2) { animation-delay: 0.18s; }
      .wasl-dot:nth-of-type(3) { animation-delay: 0.36s; }
      @keyframes wasl-breathe { 0%, 100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes wasl-dot { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-2px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .wasl-breathe, .wasl-dot { animation: none; } }
    </style>
  </defs>
  <circle cx="32" cy="32" r="29" stroke="url(#wasl-logo-ring)" stroke-width="3.5" fill="none"/>
  <circle cx="32" cy="32" r="26" fill="url(#wasl-logo-grad)" fill-opacity="0.08"/>
  <path d="M10 22 A 26 26 0 0 1 22 10" stroke="url(#wasl-logo-ring)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <g class="wasl-breathe" transform="translate(16 18)">
    <path d="M0 6C0 2.69 2.69 0 6 0h20c3.31 0 6 2.69 6 6v10c0 3.31-2.69 6-6 6H12l-7 5v-5H6c-3.31 0-6-2.69-6-6V6Z" fill="url(#wasl-logo-grad)"/>
    <circle class="wasl-dot" cx="9" cy="11" r="2" fill="#FDFCF9"/>
    <circle class="wasl-dot" cx="16" cy="11" r="2" fill="#FDFCF9"/>
    <circle class="wasl-dot" cx="23" cy="11" r="2" fill="#FDFCF9"/>
  </g>
</svg>
