<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4a5a"/>
      <stop offset="50%" stop-color="#4a6b88"/>
      <stop offset="100%" stop-color="#c25a6e"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5c98a"/>
      <stop offset="100%" stop-color="#9a7a3e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  
  <!-- Cirkle logo mark -->
  <g transform="translate(600, 180)">
    <circle cx="0" cy="-32" r="22" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.9"/>
    <circle cx="-18" cy="0" r="22" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.9"/>
    <circle cx="18" cy="0" r="22" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.9"/>
    <circle cx="0" cy="-8" r="6" fill="url(#gold-grad)"/>
  </g>
  
  <!-- App name -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="bold" fill="url(#gold-grad)">Wasl</text>
  
  <!-- Tagline -->
  <text x="600" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="rgba(255,255,255,0.85)">Simple. Secure. Connected.</text>
  
  <!-- Feature badges -->
  <g transform="translate(600, 420)">
    <g transform="translate(-280, 0)">
      <rect x="-80" y="-20" width="160" height="40" rx="20" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
      <text x="0" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)">End-to-end encrypted</text>
    </g>
    <g transform="translate(-80, 0)">
      <rect x="-60" y="-20" width="120" height="40" rx="20" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
      <text x="0" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)">Real-time</text>
    </g>
    <g transform="translate(120, 0)">
      <rect x="-80" y="-20" width="160" height="40" rx="20" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
      <text x="0" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)">Verified agreements</text>
    </g>
  </g>
  
  <!-- Cirkle branding -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">Powered by Cirkle</text>
</svg>
